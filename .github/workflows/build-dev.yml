name: Build and Push to ECR

on:
  push:
    branches:
      - devs

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Get commit info
        id: commit
        run: |
          echo "sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          echo "author=${{ github.actor }}" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --pretty=%B)" >> $GITHUB_OUTPUT
      
      - name: Configure AWS CLI
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          aws configure set aws_access_key_id $AWS_ACCESS_KEY_ID
          aws configure set aws_secret_access_key $AWS_SECRET_ACCESS_KEY
          aws configure set region $AWS_REGION
      
      - name: Build and Push Docker Image
        env:
          ECR_REPOSITORY: test-deploy
          IMAGE_TAG: ${{ github.sha }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          ECR_URI=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_URI
          docker build -t $ECR_URI:$IMAGE_TAG .
          docker tag $ECR_URI:$IMAGE_TAG $ECR_URI:latest
          docker push $ECR_URI:$IMAGE_TAG
          docker push $ECR_URI:latest
      
      - name: Build Summary
        run: |
          echo "=========================================="
          echo "BUILD COMPLETED SUCCESSFULLY"
          echo "=========================================="
          echo "Image Tag: ${{ steps.commit.outputs.sha }}"
          echo "Short SHA: ${{ steps.commit.outputs.short_sha }}"
          echo "Triggered by: ${{ steps.commit.outputs.author }}"
          echo "Commit message: ${{ steps.commit.outputs.message }}"
          echo "=========================================="
          echo ""
          echo "Image is ready in ECR"
          echo "To deploy, go to Actions tab and run 'Manual Deploy to Dev'"
          echo "Use image tag: ${{ steps.commit.outputs.sha }}"
